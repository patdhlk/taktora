[package]
name        = "ethercat-real-bus"
version     = "0.1.0"
edition     = "2024"
publish     = false
description = "taktora integration example: executor + ethercat connector against an EK1100 + EL1008 over a real Linux NIC"
license     = "Apache-2.0 OR MIT"

[workspace]
# Empty — opt out of parent workspace discovery so this crate's
# location (potentially inside `.claude/worktrees/...`) doesn't get
# pulled into the outer repo's workspace. Established pattern across
# every example in this directory.

[dependencies]
taktora-executor                = "0.1"
taktora-connector-core          = "0.2"
taktora-connector-host          = "0.1"
taktora-connector-transport-iox = "0.1"
taktora-connector-ethercat      = { version = "0.1", features = ["bus-integration"] }

# ESI device-driver toolchain. These two crates are unpublished, so they are
# path-only here (a local hardware demo, never built from crates.io). The
# build script (below) turns the trimmed Beckhoff fixtures in `esi/` into a
# generated `devices.rs`; `taktora-ethercat-esi-rt` provides the EsiDevice
# trait + bitvec re-exports the generated code and this binary share.
taktora-ethercat-esi-rt         = { path = "../../crates/taktora-ethercat-esi-rt" }
bitvec                          = "1"

clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
taktora-ethercat-esi-build      = { path = "../../crates/taktora-ethercat-esi-build" }

