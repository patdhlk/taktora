[package]
name        = "ethercat-wago-coupler"
version     = "0.1.0"
edition     = "2024"
publish     = false
description = "taktora integration example: executor + ethercat connector mirroring a WAGO 750-430's 8 inputs to a 750-530's 8 outputs through a 750-354 coupler over a real Linux NIC"
license     = "Apache-2.0 OR MIT"

[workspace]
# Empty — opt out of parent workspace discovery so this crate's
# location (potentially inside `.claude/worktrees/...`) doesn't get
# pulled into the outer repo's workspace. Established pattern across
# every example in this directory.

[dependencies]
# NOTE: 0.2 (not 0.1) for the same reason as the connector below — `^0.1`
# rejects the local 0.2.x path patch AND splits the dependency graph into two
# `taktora_executor` versions (the published connector-host already requires
# ^0.2.0), which fails `register_with` with a type mismatch.
taktora-executor                = "0.2"
taktora-connector-core          = "0.2"
taktora-connector-host          = "0.1"
taktora-connector-transport-iox = "0.1"
# NOTE: 0.2 (not 0.1) so the `[patch.crates-io]` path override (local 0.2.x)
# actually applies — `^0.1` rejects the 0.2.x patch and silently falls back to
# the stale published connector. This example needs ≥0.2.5 for the
# cyclic-traffic SAFE-OP → OP walk (REQ_0841) the WAGO 750-354 requires;
# 0.4 is the current published major (non_exhaustive SubDeviceMap).
taktora-connector-ethercat      = { version = "0.4", features = ["bus-integration"] }

clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

