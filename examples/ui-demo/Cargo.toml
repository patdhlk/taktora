[package]
name        = "ui-demo"
version     = "0.1.0"
edition     = "2024"
publish     = false
description = "taktora integration example: a hardware-free MVVM UI connector producer (executor + UiConnector + simulated stepper) — the FEAT_0092 v1 validation slice"
license     = "Apache-2.0 OR MIT"

# Split into a library (the unit-tested simulation + domain model) and a thin
# binary (the executor + connector wiring), mirroring the ethercat-stepper
# example so `tests/` can import the model as `ui_demo::...`.
[lib]
name = "ui_demo"
path = "src/lib.rs"

[[bin]]
name = "ui-demo"
path = "src/main.rs"

[workspace]
# Empty — opt out of parent workspace discovery so this crate is its own
# workspace (the parent repo `exclude`s `examples`). Established pattern across
# every example in this directory.

[dependencies]
# NOTE: the UI connector crates are brand-new and UNPUBLISHED (0.1.0 on this
# branch), so — unlike the published `taktora-connector-*` crates other examples
# pull via a version req + a toggled `[patch.crates-io]` block — they MUST be
# referenced by path. To keep a SINGLE `taktora-executor` in the graph (a
# version split between a published executor and the path UI crates' workspace
# executor would fail `register_with` with a type mismatch), every taktora crate
# here is a path dependency too. There is therefore no `examples-local.sh` patch
# block: this example always builds against the local crates.
taktora-executor       = { path = "../../crates/taktora-executor" }
taktora-connector-core = { path = "../../crates/taktora-connector-core" }
taktora-connector-host = { path = "../../crates/taktora-connector-host" }
taktora-connector-ui   = { path = "../../crates/taktora-connector-ui" }

crossbeam-channel = "0.5"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tracing           = "0.1"

[dev-dependencies]
taktora-connector-ui-contract = { path = "../../crates/taktora-connector-ui-contract" }
taktora-connector-ui-client   = { path = "../../crates/taktora-connector-ui-client" }
serde_json                    = "1"
