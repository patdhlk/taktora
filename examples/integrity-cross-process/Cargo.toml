[package]
name        = "integrity-cross-process"
version     = "0.1.0"
edition     = "2024"
publish     = false
description = "taktora integration example: cross-process integrity isolation via iceoryx2"
license     = "Apache-2.0 OR MIT"

# Make this example a standalone workspace so it never accidentally joins a
# parent Cargo workspace (e.g. when checked out under a nested directory like
# `.claude/worktrees/...`). Each example owns its own `Cargo.lock`.
[workspace]

[lib]
name = "integrity_cross_process"
path = "src/lib.rs"

[[bin]]
name = "safety_process"
path = "src/bin/safety_process.rs"

[[bin]]
name = "quality_process"
path = "src/bin/quality_process.rs"

[dependencies]
# NOTE: version reqs must track the CURRENT published majors — a `^0.1` req on a
# crate whose local/published version is 0.2.x silently rejects the
# `[patch.crates-io]` path override (examples-local.sh on becomes a no-op
# building stale crates.io versions) and can split the dependency graph into
# two versions of a shared crate, failing cross-crate API calls with type
# mismatches. Same trap previously fixed in the ethercat-real-bus and
# ethercat-wago-coupler examples.
taktora-executor                = "0.6"
taktora-connector-core          = "0.2"
taktora-connector-transport-iox = "0.1"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
iceoryx2    = "0.9"

