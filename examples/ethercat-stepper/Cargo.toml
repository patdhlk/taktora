[package]
name        = "ethercat-stepper"
version     = "0.1.0"
edition     = "2024"
publish     = false
description = "taktora integration example: executor + ethercat connector driving a Beckhoff EL7047 stepper off EL1008 inputs"
license     = "Apache-2.0 OR MIT"

# Split into a library + a thin binary. The library exposes the modules
# (`generated`, `el7047_domain`, `el7047_adapter`, ...) so that integration
# tests under `tests/` can import them as `ethercat_stepper::...`. `main.rs`
# is a thin binary that `use`s the same library.
[lib]
name = "ethercat_stepper"
path = "src/lib.rs"

[[bin]]
name = "ethercat-stepper"
path = "src/main.rs"

[workspace]
# Empty — opt out of parent workspace discovery so this crate's
# location (potentially inside `.claude/worktrees/...`) doesn't get
# pulled into the outer repo's workspace. Established pattern across
# every example in this directory.

[dependencies]
# NOTE: 0.2 (not 0.1) for the same reason as the connector below — `^0.1`
# rejects the local 0.2.x path patch AND splits the dependency graph into two
# `taktora_executor` versions (the published connector-host 0.1.8 requires
# ^0.2.0), which fails `register_with` with a type mismatch.
taktora-executor                = "0.6"
taktora-connector-core          = "0.2"
taktora-connector-host          = "0.1"
taktora-connector-transport-iox = "0.1"
# NOTE: must track the current published major so the `[patch.crates-io]` path
# override actually applies — a stale caret req silently falls back to the
# published crate (this produced the bogus WKC `expected 9` on the bus once).
# 0.4 is the current published major (non_exhaustive SubDeviceMap constructors
# + SmWatchdog + with_startup_sdos/StartupSdo + netcfg op-mode codegen this
# example relies on). CI enforces this via scripts/check-example-patch-skew.sh.
taktora-connector-ethercat      = { version = "0.4", features = ["bus-integration"] }

# ESI device-driver toolchain. These two crates are unpublished, so they are
# path-only here (a local hardware demo, never built from crates.io). The
# build script (below) turns the trimmed Beckhoff fixtures in `esi/` into a
# generated `devices.rs`; `taktora-ethercat-esi-rt` provides the EsiDevice
# trait + bitvec re-exports the generated code and this binary share.
taktora-ethercat-esi-rt         = { path = "../../crates/taktora-ethercat-esi-rt" }
bitvec                          = "1"

clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
taktora-ethercat-esi-build      = { path = "../../crates/taktora-ethercat-esi-build" }
taktora-ethercat-netcfg-build   = { path = "../../crates/taktora-ethercat-netcfg-build" }

