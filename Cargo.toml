[workspace]
resolver = "2"
members = [
    "crates/taktora-bounded-alloc",
    "crates/taktora-connector-can",
    "crates/taktora-connector-codec",
    "crates/taktora-connector-core",
    "crates/taktora-connector-ethercat",
    "crates/taktora-connector-host",
    "crates/taktora-connector-transport-iox",
    "crates/taktora-connector-zenoh",
    "crates/taktora-executor",
    "crates/taktora-executor-tracing",
    "crates/taktora-log",
    "crates/taktora-log-dlt",
    "crates/taktora-replay",
]

[workspace.package]
# NOTE: no shared `version` here — each crate carries its own version
# in its [package] table so release-plz can bump them independently.
# Internal-crate version pins live in [workspace.dependencies] below.
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0 OR MIT"
repository   = "https://github.com/patdhlk/taktora"
homepage     = "https://taktora.eu"
authors      = ["Patrick Dahlke"]
readme       = "README.md"
keywords     = ["iceoryx2", "ipc", "realtime", "robotics", "ethercat"]
categories   = ["embedded", "concurrency", "network-programming"]

[workspace.dependencies]
# Internal crates — declared with both `path` (for local builds) and `version`
# (so `cargo publish` strips the path and resolves against crates.io).
taktora-bounded-alloc            = { path = "crates/taktora-bounded-alloc",            version = "0.1.0" }
taktora-connector-codec          = { path = "crates/taktora-connector-codec",          version = "0.1.0" }
taktora-connector-core           = { path = "crates/taktora-connector-core",           version = "0.1.0" }
taktora-connector-host           = { path = "crates/taktora-connector-host",           version = "0.1.0" }
taktora-connector-transport-iox  = { path = "crates/taktora-connector-transport-iox",  version = "0.1.0" }
taktora-executor                 = { path = "crates/taktora-executor",                 version = "0.1.0" }
taktora-executor-tracing         = { path = "crates/taktora-executor-tracing",         version = "0.1.0" }
taktora-log                      = { path = "crates/taktora-log",                      version = "0.1.0" }
taktora-log-dlt                  = { path = "crates/taktora-log-dlt",                  version = "0.1.0" }

# External crates
iceoryx2          = "0.8"
thiserror         = "1"
bitflags          = "2"
crossbeam-channel = "0.5"
crossbeam-utils   = "0.8"
num_cpus          = "1"
log               = { version = "0.4.21", features = ["kv"] }
tracing           = "0.1"
tracing-log       = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
dlt-core          = { version = "0.20" }
core_affinity     = "0.8"
serde             = { version = "1", default-features = false }
serde_json        = { version = "1", default-features = false }
rand              = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
tokio             = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
ethercrab         = { version = "0.7", default-features = false, features = ["std"] }

# dev-only
proptest          = "1"
loom              = "0.7"
