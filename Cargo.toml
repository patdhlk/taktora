ethercrab         = { version = "0.7", default-features = false, features = ["std"] }
serde_norway      = "0.9"
toml              = { version = "1", default-features = false, features = ["parse", "serde"] }
quick-xml         = { version = "0.40", default-features = false, features = ["serialize"] }
proc-macro2       = "1"
quote             = "1"
syn               = { version = "2", default-features = false, features = ["printing"] }
prettyplease      = "0.2"
encoding_rs       = "0.8"
humantime         = "2"
clap              = { version = "4", features = ["derive"] }
glob              = "0.3"
libm              = "0.2"
axum              = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http        = { version = "0.6", default-features = false }
axum-server       = { version = "0.7", default-features = false }

# dev-only
proptest          = "1"
trybuild          = "1"
loom              = "0.7"
tempfile          = "3"
rsruckig          = "2"
pollster          = "0.3"

# Pinned alloc-free fork of iceoryx2 0.8.1's WaitSet fd-notification dispatch
# (REQ_0104). Upstream allocates two scratch Vecs per fired-fd dispatch
# (waitset.rs ~901 + ~624), which the master-timerfd cyclic path hits every
# cycle, violating the zero-alloc steady-state guarantee. The fork reuses the
# per-wait triggered-fd buffer and drops the dead (fd, deadline-idx) Vec.
# src/waitset.rs differs from published 0.8.1; src/service/mod.rs additionally
# imports the container `String` trait so `as_str` resolves under newer nightly
# (rust-lang/rust#147992) — the rustdoc-JSON build cargo-public-api drives would
# otherwise fail to compile iceoryx2. Remove once released upstream.
# Fork: https://github.com/patdhlk/iceoryx2 (branch taktora-pin-0.8.1-alloc-free).
[patch.crates-io]
iceoryx2 = { git = "https://github.com/patdhlk/iceoryx2", rev = "c6a41fccda31668e53dc86d2a1fe95ba34af732d" }
