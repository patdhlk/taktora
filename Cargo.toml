    "crates/taktora-motion-core-tests",
    "crates/taktora-cyclic-fieldbus",
    "crates/taktora-cyclic-fieldbus-tests",
    "crates/taktora-cia402",
    "crates/taktora-motion-proto",
    "crates/taktora-motion",
    "crates/taktora-motion-tests",
    "crates/taktora-replay",
    "crates/taktora-stats",
    "crates/taktora-telemetry-export",
    "crates/taktora-medkit-model",
    "crates/taktora-medkit-manifest",
    "crates/taktora-medkit-provider",
    "crates/taktora-medkit-gateway",
    "crates/taktora-medkit-gateway-axum",
    "crates/taktora-medkit-gateway-axum-tests",
    "crates/taktora-medkit-binding-executor",
    "crates/taktora-medkit-binding-executor-tests",
    "crates/taktora-medkit-binding-connector",
    "crates/taktora-medkit-binding-connector-tests",
