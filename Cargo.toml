[workspace]
resolver = "2"
exclude = ["examples"]
members = [
    "crates/taktora-ethercat-esi",
    "crates/taktora-ethercat-esi-codegen",
    "crates/taktora-ethercat-esi-codegen-ethercrab",
    "crates/taktora-ethercat-esi-codegen-ethercrab-tests",
    "crates/taktora-ethercat-esi-build",
    "crates/taktora-ethercat-esi-rt",
    "crates/taktora-ethercat-netcfg",
    "crates/taktora-fieldbus-od-core",
    "crates/taktora-ethercat-netcfg-build",
    "crates/taktora-ethercat-netcfg-cli",
    "crates/taktora-ethercat-netcfg-codegen",
    "crates/taktora-bounded-alloc",
    "crates/taktora-connector-can",
    "crates/taktora-connector-can-tests",
    "crates/taktora-connector-codec",
    "crates/taktora-connector-core",
    "crates/taktora-connector-ethercat",
    "crates/taktora-connector-ethercat-tests",
    "crates/taktora-connector-host",
    "crates/taktora-connector-host-tests",
    "crates/taktora-connector-transport-iox",
    "crates/taktora-connector-zenoh",
    "crates/taktora-connector-zenoh-tests",
    "crates/taktora-executor",
    "crates/taktora-executor-tests",
    "crates/taktora-executor-tracing",
    "crates/taktora-executor-tracing-tests",
    "crates/taktora-log",
    "crates/taktora-log-dlt",
    "crates/taktora-motion-core",
    "crates/taktora-motion-core-tests",
    "crates/taktora-cyclic-fieldbus",
    "crates/taktora-cyclic-fieldbus-tests",
    "crates/taktora-cia402",
    "crates/taktora-motion-proto",
    "crates/taktora-motion",
    "crates/taktora-motion-tests",
    "crates/taktora-replay",
    "crates/taktora-stats",
    "crates/taktora-telemetry-export",
    "xtask/preempt-rt",
]

[workspace.package]
# NOTE: no shared `version` here — each crate carries its own version
# in its [package] table so release-plz can bump them independently.
# Internal-crate version pins live in [workspace.dependencies] below.
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0 OR MIT"
repository   = "https://github.com/patdhlk/taktora"
homepage     = "https://taktora.eu"
authors      = ["Patrick Dahlke"]
readme       = "README.md"
keywords     = ["iceoryx2", "ipc", "realtime", "robotics", "ethercat"]
categories   = ["embedded", "concurrency", "network-programming"]

[workspace.dependencies]
# Internal crates — declared with both `path` (for local builds) and `version`
# (so `cargo publish` strips the path and resolves against crates.io).
taktora-ethercat-esi                     = { path = "crates/taktora-ethercat-esi", version = "0.4.0" }
taktora-ethercat-esi-codegen             = { path = "crates/taktora-ethercat-esi-codegen", version = "0.2.0" }
taktora-ethercat-esi-codegen-ethercrab   = { path = "crates/taktora-ethercat-esi-codegen-ethercrab", version = "0.1.5" }
taktora-ethercat-esi-codegen-ethercrab-tests = { path = "crates/taktora-ethercat-esi-codegen-ethercrab-tests", version = "0.1.0" }
taktora-ethercat-esi-build               = { path = "crates/taktora-ethercat-esi-build", version = "0.2.0" }
taktora-ethercat-esi-rt                  = { path = "crates/taktora-ethercat-esi-rt", version = "0.1.3" }
taktora-fieldbus-od-core                 = { path = "crates/taktora-fieldbus-od-core", version = "0.1.3" }
taktora-ethercat-netcfg                  = { path = "crates/taktora-ethercat-netcfg", version = "0.3.2" }
taktora-ethercat-netcfg-build            = { path = "crates/taktora-ethercat-netcfg-build", version = "0.1.6" }
taktora-ethercat-netcfg-cli              = { path = "crates/taktora-ethercat-netcfg-cli", version = "0.1.6" }
taktora-ethercat-netcfg-codegen          = { path = "crates/taktora-ethercat-netcfg-codegen", version = "0.1.6" }
taktora-bounded-alloc            = { path = "crates/taktora-bounded-alloc", version = "0.1.6" }
taktora-connector-can            = { path = "crates/taktora-connector-can", version = "0.1.10" }
taktora-connector-codec          = { path = "crates/taktora-connector-codec", version = "0.1.8" }
taktora-connector-core           = { path = "crates/taktora-connector-core", version = "0.2.7" }
taktora-connector-ethercat       = { path = "crates/taktora-connector-ethercat", version = "0.3.2" }
taktora-connector-host           = { path = "crates/taktora-connector-host", version = "0.1.10" }
taktora-connector-transport-iox  = { path = "crates/taktora-connector-transport-iox", version = "0.1.8" }
taktora-connector-zenoh          = { path = "crates/taktora-connector-zenoh", version = "0.2.9" }
taktora-executor                 = { path = "crates/taktora-executor", version = "0.2.2" }
taktora-executor-tracing         = { path = "crates/taktora-executor-tracing", version = "0.1.9" }
taktora-log                      = { path = "crates/taktora-log", version = "0.1.2" }
taktora-log-dlt                  = { path = "crates/taktora-log-dlt", version = "0.1.5" }
taktora-motion-core              = { path = "crates/taktora-motion-core", version = "0.1.2" }
taktora-cyclic-fieldbus          = { path = "crates/taktora-cyclic-fieldbus", version = "0.1.3" }
taktora-cia402                   = { path = "crates/taktora-cia402", version = "0.1.2" }
taktora-motion-proto             = { path = "crates/taktora-motion-proto", version = "0.1.2" }
taktora-motion                   = { path = "crates/taktora-motion", version = "0.1.2" }
taktora-stats                    = { path = "crates/taktora-stats", version = "0.1.3" }
taktora-telemetry-export         = { path = "crates/taktora-telemetry-export", version = "0.1.0" }

# External crates
iceoryx2          = "0.8"
thiserror         = "2"
bitflags          = "2"
bitvec            = "1"
crossbeam-channel = "0.5"
crossbeam-utils   = "0.8"
num_cpus          = "1"
log               = { version = "0.4.21", features = ["kv", "std"] }
tracing           = "0.1"
dlt-core          = { version = "0.20" }
core_affinity     = "0.8"
serde             = { version = "1", default-features = false }
serde_json        = { version = "1", default-features = false }
rand              = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
sha2              = "0.10"
tokio             = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
ethercrab         = { version = "0.7", default-features = false, features = ["std"] }
serde_norway      = "0.9"
quick-xml         = { version = "0.40", default-features = false, features = ["serialize"] }
proc-macro2       = "1"
quote             = "1"
syn               = { version = "2", default-features = false, features = ["printing"] }
prettyplease      = "0.2"
encoding_rs       = "0.8"
clap              = { version = "4", features = ["derive"] }
glob              = "0.3"
libm              = "0.2"

# dev-only
proptest          = "1"
loom              = "0.7"
tempfile          = "3"
rsruckig          = "2"
pollster          = "0.3"

# Pinned alloc-free fork of iceoryx2 0.8.1's WaitSet fd-notification dispatch
# (REQ_0104). Upstream allocates two scratch Vecs per fired-fd dispatch
# (waitset.rs ~901 + ~624), which the master-timerfd cyclic path hits every
# cycle, violating the zero-alloc steady-state guarantee. The fork reuses the
# per-wait triggered-fd buffer and drops the dead (fd, deadline-idx) Vec; only
# src/waitset.rs differs from published 0.8.1. Remove once released upstream.
# Fork: https://github.com/patdhlk/iceoryx2 (branch taktora-pin-0.8.1-alloc-free).
[patch.crates-io]
iceoryx2 = { git = "https://github.com/patdhlk/iceoryx2", rev = "bf3f4be595fc0388047fff68e29b149765c8f04b" }
