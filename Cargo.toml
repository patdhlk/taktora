    "crates/taktora-connector-ethercat-tests",
    "crates/taktora-connector-host",
    "crates/taktora-connector-host-tests",
    "crates/taktora-connector-j1939",
    "crates/taktora-connector-j1939-tests",
    "crates/taktora-connector-transport-iox",
    "crates/taktora-connector-ui-contract",
    "crates/taktora-connector-ui-derive",
    "crates/taktora-connector-ui",
    "crates/taktora-connector-ui-client",
    "crates/taktora-connector-ui-adapters",
    "crates/taktora-connector-ui-tests",
    "crates/taktora-connector-zenoh",
    "crates/taktora-connector-zenoh-tests",
    "crates/taktora-executor",
    "crates/taktora-executor-tests",
    "crates/taktora-executor-tracing",
    "crates/taktora-executor-tracing-tests",
    "crates/taktora-log",
    "crates/taktora-log-dlt",
