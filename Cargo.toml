taktora-ethercat-netcfg-build            = { path = "crates/taktora-ethercat-netcfg-build", version = "0.1.9" }
taktora-ethercat-netcfg-cli              = { path = "crates/taktora-ethercat-netcfg-cli", version = "0.1.9" }
