    "crates/taktora-idl-core",
    "crates/taktora-idl-dbc",
    "crates/taktora-idl-wire",
    "crates/taktora-idl-codegen",
    "crates/taktora-idl-codegen-can",
    "crates/taktora-idl-codegen-can-tests",
    "crates/taktora-ethercat-netcfg-build",
