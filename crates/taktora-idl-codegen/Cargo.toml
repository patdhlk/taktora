[package]
name         = "taktora-idl-codegen"
version      = "0.1.2"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Policy-owning codegen layer for the message-plane IR: naming policy, the MessageBackend trait, and the resolve+generate entry point. Plane-generic; knows no wire format."

[dependencies]
taktora-idl-core = { workspace = true }
proc-macro2      = { workspace = true }
quote            = { workspace = true }
thiserror        = { workspace = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
