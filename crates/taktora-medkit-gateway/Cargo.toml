[package]
name         = "taktora-medkit-gateway"
version      = "0.1.3"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Transport-neutral read-diagnostic core for taktora-medkit: resolves entity-tree queries, fault lists, and the worst-wins health rollup over a `Provider`, independent of any HTTP framework. Zero taktora dependencies."

[dependencies]
taktora-medkit-model    = { workspace = true }
taktora-medkit-manifest = { workspace = true }
taktora-medkit-provider = { workspace = true }

serde_json = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
