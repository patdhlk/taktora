[package]
name         = "taktora-connector-ethercat"
version      = "0.3.1"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "EtherCAT reference connector for the taktora-connector framework. Implements BB_0030 (FEAT_0041)."

[features]
default = []
# `bus-integration` pulls `ethercrab` and exposes the `bus_driver`
# module that wires the pure-logic helpers (sdo / scheduler / wkc)
# to a real EtherCAT MainDevice. Off by default so consumers that
# only want the framework types and pure-logic helpers don't pull
# ethercrab's transitive dependencies.
bus-integration = ["dep:ethercrab"]

[dependencies]
taktora-connector-core           = { workspace = true }
taktora-connector-transport-iox  = { workspace = true }
taktora-connector-host           = { workspace = true }
taktora-executor                 = { workspace = true }
iceoryx2                       = { workspace = true }
crossbeam-channel              = { workspace = true }
tokio                          = { workspace = true }
serde                          = { workspace = true, features = ["std"] }
thiserror                      = { workspace = true }
ethercrab                      = { workspace = true, optional = true }

[dev-dependencies]
proptest              = { workspace = true }
serde_json            = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
