[package]
name         = "taktora-idl-codegen-can"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "CAN/DBC MessageBackend: emits taktora-idl-wire WireType implementations that bit-pack each field per the DBC signal layout."

[dependencies]
taktora-idl-codegen = { workspace = true }
taktora-idl-dbc     = { workspace = true }
proc-macro2         = { workspace = true }
quote               = { workspace = true }

[dev-dependencies]
prettyplease     = { workspace = true }
syn              = { workspace = true, features = ["parsing", "full"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
