[package]
name         = "taktora-connector-mqtt-tests"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Integration tests for taktora-connector-mqtt that exercise the MQTT connector against other in-tree connector crates. Not published; holds dev-deps on sibling workspace crates so taktora-connector-mqtt's published manifest stays free of internal-crate dev-deps that would race release-plz's topological-sort during publish."
publish      = false

[lib]
# Empty stub — the crate exists solely to host integration tests under
# `tests/`. A `src/lib.rs` is required so Cargo treats this as a package.

[features]
# Passthroughs to the parent crate's real-backend features. Declared here so
# `tests/real_broker.rs`'s `#![cfg(feature = "rumqttc-integration")]` is
# recognised by cargo's `unexpected_cfgs` lint and the file compiles under
# `--features rumqttc-integration` / `--all-features`. Off by default so the
# lean `cargo test -p taktora-connector-mqtt-tests` (and `--no-default-features`)
# never pulls rumqttc; the broker-in-CI job opts in explicitly.
default = []
rumqttc-integration = ["taktora-connector-mqtt/rumqttc-integration"]
tls = ["taktora-connector-mqtt/tls", "rumqttc-integration"]

[dev-dependencies]
taktora-connector-mqtt           = { workspace = true }
taktora-connector-codec          = { workspace = true }
taktora-connector-core           = { workspace = true }
taktora-connector-host           = { workspace = true }
taktora-connector-transport-iox  = { workspace = true }
taktora-executor                 = { workspace = true }
iceoryx2                         = { workspace = true }

serde = { workspace = true, features = ["std", "derive"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
