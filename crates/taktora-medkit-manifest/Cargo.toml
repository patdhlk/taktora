[package]
name         = "taktora-medkit-manifest"
version      = "0.1.1"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "The mandatory Area/Component grouping manifest for taktora-medkit: a type-safe builder core plus a TOML loader over one shape, declaring the diagnostic skeleton and the entity->parent mappings the merge pipeline re-parents provider entities into. Zero taktora dependencies."

[dependencies]
taktora-medkit-model = { workspace = true }

serde = { workspace = true, features = ["std", "derive"] }
toml  = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
