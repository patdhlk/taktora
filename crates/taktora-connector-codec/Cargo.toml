[package]
name         = "taktora-connector-codec"
version      = "0.1.12"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "PayloadCodec implementations for the taktora-connector framework. Realises BB_0003 (JsonCodec behind default-on `json` feature)."

[features]
default = ["json"]
# JsonCodec via serde_json — REQ_0212. Default-on so the typical
# build pulls a working codec without extra wiring.
json    = ["dep:serde_json"]
# BinaryCodec via bincode (fixed-int + selectable endianness) — REQ_0212.
# Opt-in (NOT in default) so default builds do not pull bincode; the
# fixed-width wire format is the point (see `binary` module docs).
binary  = ["dep:bincode"]
# MsgPackCodec via rmp-serde (MessagePack) — REQ_0989. Opt-in (NOT in
# default) so default builds do not pull rmp-serde; compact binary wire
# for consumers that want smaller-than-JSON payloads.
msgpack = ["dep:rmp-serde"]

[dependencies]
taktora-connector-core = { workspace = true }
serde                = { workspace = true, features = ["std"] }
serde_json           = { workspace = true, optional = true, features = ["std"] }
rmp-serde            = { workspace = true, optional = true }
bincode              = { workspace = true, optional = true }

[dev-dependencies]
serde      = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
proptest   = { workspace = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
