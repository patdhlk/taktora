[package]
name         = "taktora-ethercat-esi-codegen"
version      = "0.1.2"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Codegen layer for EtherCAT ESI device drivers: naming/collision policy, the CodegenBackend trait, and the generate entry point producing proc-macro2 token streams."

[dependencies]
taktora-ethercat-esi     = { workspace = true }
taktora-fieldbus-od-core = { workspace = true }
proc-macro2 = { workspace = true }
quote       = { workspace = true }
thiserror   = { workspace = true }

[dev-dependencies]
taktora-ethercat-esi = { workspace = true }
syn = { workspace = true, features = ["full", "parsing"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
