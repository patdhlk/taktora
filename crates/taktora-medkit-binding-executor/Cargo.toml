[package]
name         = "taktora-medkit-binding-executor"
version      = "0.2.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "taktora binding for taktora-medkit: sources liveness and timing from taktora-executor Observer/ExecutionMonitor hooks and feeds them, off the control path, into the medkit provider seam. One of the two crates where taktora coupling is quarantined."

[dependencies]
taktora-medkit-model    = { workspace = true }
taktora-medkit-provider = { workspace = true }
taktora-executor        = { workspace = true }
serde_json              = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
