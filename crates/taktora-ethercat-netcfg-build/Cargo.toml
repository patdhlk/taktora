[package]
name         = "taktora-ethercat-netcfg-build"
version      = "0.1.4"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "build.rs glue turning an taktora-ethercat-netcfg network.yaml into a generated Rust module in OUT_DIR."

[dependencies]
taktora-ethercat-netcfg         = { workspace = true }
taktora-ethercat-netcfg-codegen = { workspace = true }
thiserror               = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
syn      = { workspace = true, features = ["full", "parsing"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
