[package]
name         = "taktora-cyclic-fieldbus-tests"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Integration tests for taktora-cyclic-fieldbus telemetry. Not published; holds dev-deps on sibling workspace crates so the published manifests stay free of internal-crate dev-deps that would race release-plz's topological sort during publish."
publish      = false

[lib]
# Empty stub — the crate exists solely to host integration tests under
# `tests/`. A `src/lib.rs` is required so Cargo treats this as a package.

[dev-dependencies]
taktora-cyclic-fieldbus = { workspace = true }
taktora-stats           = { workspace = true }
pollster                = { workspace = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
