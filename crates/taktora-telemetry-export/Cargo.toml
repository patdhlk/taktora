[package]
name         = "taktora-telemetry-export"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Off-RT-thread telemetry export: seqlock overwrite-oldest ring + NDJSON drain for taktora-executor cycle observations."
publish      = false

[dependencies]
taktora-executor = { workspace = true }

[lints.rust]
# This crate implements a seqlock ring; unsafe is required for the
# UnsafeCell payload and is contained to `ring.rs`.
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
