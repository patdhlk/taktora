[package]
name         = "taktora-connector-ui-derive"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Authoring derive macros (`ViewModel`, `CommandParams`, `ImageEnum`) for the taktora UI connector: POD image lowering, schema generation, and contract contributions. Implements FEAT_0092."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote       = { workspace = true }
syn         = { workspace = true, features = ["full", "extra-traits", "derive", "parsing", "proc-macro", "clone-impls"] }
