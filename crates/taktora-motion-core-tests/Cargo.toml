[package]
name         = "taktora-motion-core-tests"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Integration tests for taktora-motion-core that exercise it against other in-tree crates. Not published; holds dev-deps on sibling workspace crates so taktora-motion-core's published manifest stays free of internal-crate dev-deps that would race release-plz's topological-sort during publish."
publish      = false

[lib]
# Empty stub — the crate exists solely to host integration tests under
# `tests/`. A `src/lib.rs` is required so Cargo treats this as a package.

[dev-dependencies]
taktora-motion-core   = { workspace = true }
taktora-bounded-alloc = { workspace = true }
# Host-only differential oracle: Ruckig's time-optimal jerk-limited trajectory
# is the reference the alloc-free S-curve is checked against (it validates the
# case selection that analytic invariants alone cannot pin down).
rsruckig              = { workspace = true }
proptest              = { workspace = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
# Oracle tolerance expressions (`scale * d + abs`) read clearest un-fused.
suboptimal_flops        = "allow"
