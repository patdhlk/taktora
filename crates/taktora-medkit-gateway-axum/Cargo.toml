[package]
name         = "taktora-medkit-gateway-axum"
version      = "0.4.2"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "axum HTTP surface for taktora-medkit: serves the read-diagnostic core over the ros2_medkit-compatible REST contract on a tokio runtime. axum/tokio are not taktora dependencies, so this crate stays part of the extractable core."

[dependencies]
taktora-medkit-gateway  = { workspace = true }
taktora-medkit-manifest = { workspace = true }
taktora-medkit-provider = { workspace = true }
taktora-medkit-model    = { workspace = true }

axum         = { workspace = true, features = ["json"] }
tokio        = { workspace = true, features = ["net"] }
# `time` adds the `IntervalStream` wrapper the cyclic-subscription sampler drives
# its periodic SSE off (`REQ_0977`); `sync` (the workspace default) backs the
# trigger broadcast stream.
tokio-stream = { workspace = true, features = ["time"] }
tower-http = { workspace = true, features = ["cors"] }
serde      = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
# Minimal, zero-dependency RFC3339 formatter for the absolute `lock_expiration`
# field in the SOVD Lock response (issue #149); no broader date/time crate exists
# in the workspace and none is otherwise needed.
humantime  = { workspace = true }

# Optional TLS: enabling the `tls` feature serves over rustls via axum-server.
axum-server = { workspace = true, optional = true, features = ["tls-rustls"] }

[features]
# Off by default: the dev skeleton serves plaintext. Enabling `tls` pulls in
# axum-server + rustls and activates the TLS serve path when a TlsConfig is set.
tls = ["dep:axum-server"]

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
