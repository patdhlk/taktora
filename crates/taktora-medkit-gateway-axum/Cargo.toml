[package]
name         = "taktora-medkit-gateway-axum"
version      = "0.1.1"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "axum HTTP surface for taktora-medkit: serves the read-diagnostic core over the ros2_medkit-compatible REST contract on a tokio runtime. axum/tokio are not taktora dependencies, so this crate stays part of the extractable core."

[dependencies]
taktora-medkit-gateway  = { workspace = true }
taktora-medkit-provider = { workspace = true }

axum  = { workspace = true }
tokio = { workspace = true, features = ["net"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
