[package]
name         = "taktora-executor-tracing"
version      = "0.1.14"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "tracing-based Observer for taktora-executor."

[dependencies]
taktora-executor = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
# NOTE: no internal `taktora-*` dev-deps here. The taktora-log bridge test
# lives in the `publish = false` taktora-executor-tracing-tests crate, so this
# published manifest carries no internal dev-dep that release-plz's topological
# publish sort would mis-order (see issue #27 / release-plz#2697).
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
