[package]
name         = "taktora-connector-zenoh"
version      = "0.2.12"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Zenoh reference connector for the taktora-connector framework. Implements BB_0040 (FEAT_0042)."

[features]
default = []
# `zenoh-integration` pulls the real `zenoh` crate and exposes
# `RealZenohSession` (added in Z4f). Off by default so consumers
# that only want the framework types and `MockZenohSession` don't
# pull zenoh's transitive dependencies.
#
# We explicitly enable `zenoh/transport_tcp` so the real session can
# open `tcp/...` locators — the upstream `zenoh` crate ships with
# `default-features = false` here, which disables every transport.
zenoh-integration = ["dep:zenoh", "zenoh/transport_tcp"]

[dependencies]
taktora-connector-core           = { workspace = true }
taktora-connector-transport-iox  = { workspace = true }
taktora-connector-host           = { workspace = true }
taktora-executor                 = { workspace = true }
iceoryx2                       = { workspace = true }
crossbeam-channel              = { workspace = true }
tokio                          = { workspace = true }
serde                          = { workspace = true, features = ["std"] }
thiserror                      = { workspace = true }
tracing                        = { workspace = true }
zenoh                          = { version = "1", optional = true, default-features = false }

[dev-dependencies]
proptest              = { workspace = true }
serde_json            = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
