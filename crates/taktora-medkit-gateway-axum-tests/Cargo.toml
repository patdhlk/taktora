[package]
name         = "taktora-medkit-gateway-axum-tests"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Integration tests for taktora-medkit-gateway-axum: drives a live server and diffs read-core responses against the captured contract corpus, and asserts 501 for deferred families. Not published; holds dev-deps on sibling workspace crates so the gateway-axum published manifest stays free of internal-crate dev-deps that would race release-plz's topological sort during publish."
publish      = false

[lib]
# Empty stub — the crate exists solely to host integration tests under
# `tests/`. A `src/lib.rs` is required so Cargo treats this as a package.

[dev-dependencies]
taktora-medkit-gateway-axum = { workspace = true }
taktora-medkit-gateway      = { workspace = true }
taktora-medkit-manifest     = { workspace = true }
taktora-medkit-provider     = { workspace = true }
taktora-medkit-model        = { workspace = true }
# Compile-time build identity, exercised end-to-end through the version-info
# injection seam (`TEST_0956`). Safe here — this crate is `publish = false`, so
# it never trips the release-plz dev-dep ordering guard.
taktora-build-info          = { workspace = true }

axum       = { workspace = true, features = ["http1", "tokio"] }
tokio      = { workspace = true, features = ["net", "rt", "rt-multi-thread", "macros", "io-util"] }
serde_json = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
