[package]
name         = "taktora-connector-host"
version      = "0.1.19"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "ConnectorHost / ConnectorGateway builders and the framework's `Connector` trait. Implements BB_0005."

[features]
default = []
# Default-off `tracing` feature (REQ_0273). When enabled, the host
# wires `taktora-executor-tracing` so that `HealthEvent` and
# `ExecutionMonitor` callbacks forward through the global `tracing`
# subscriber.
tracing = ["dep:tracing", "dep:taktora-executor-tracing", "taktora-executor/tracing"]

[dependencies]
taktora-connector-core          = { workspace = true }
taktora-connector-transport-iox = { workspace = true }
taktora-executor                = { workspace = true }
taktora-executor-tracing        = { workspace = true, optional = true }
iceoryx2                      = { workspace = true }
crossbeam-channel             = { workspace = true }
serde                         = { workspace = true, features = ["std"] }
thiserror                     = { workspace = true }
tracing                       = { workspace = true, optional = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
