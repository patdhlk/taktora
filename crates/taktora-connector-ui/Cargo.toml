[package]
name         = "taktora-connector-ui"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Server-side MVVM UI connector for the taktora-connector framework: ViewModel/CommandParams authoring traits, POD image lowering, and the UiRouting type. Implements FEAT_0092."

[dependencies]
taktora-connector-core        = { workspace = true }
taktora-connector-ui-contract = { workspace = true }
taktora-connector-ui-derive   = { workspace = true }
serde                         = { workspace = true, features = ["std", "derive"] }
serde_json                    = { workspace = true, features = ["std"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
