[package]
name         = "taktora-connector-zenoh-tests"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Integration tests for taktora-connector-zenoh that exercise the Zenoh connector against other in-tree connector crates. Not published; holds dev-deps on sibling workspace crates so taktora-connector-zenoh's published manifest stays free of internal-crate dev-deps that would race release-plz's topological-sort during publish."
publish      = false

[lib]
# Empty stub — the crate exists solely to host integration tests under
# `tests/`. A `src/lib.rs` is required so Cargo treats this as a package.

[features]
# `zenoh-integration` is a passthrough to the parent crate's feature of
# the same name. Declared here so that `tests/real_session.rs`'s
# `#![cfg(feature = "zenoh-integration")]` is recognised by cargo's
# `unexpected_cfgs` lint and the file actually compiles under
# `--features zenoh-integration` or `--all-features`.
default = ["zenoh-integration"]
zenoh-integration = ["taktora-connector-zenoh/zenoh-integration"]

[dev-dependencies]
taktora-connector-zenoh = { workspace = true }

taktora-connector-codec          = { workspace = true }
taktora-connector-core           = { workspace = true }
taktora-connector-host           = { workspace = true }
taktora-connector-transport-iox  = { workspace = true }
taktora-executor                 = { workspace = true }

serde = { workspace = true, features = ["std", "derive"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
