[package]
name         = "taktora-medkit-binding-connector-tests"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Integration tests for taktora-medkit-binding-connector. Not published; holds dev-deps on sibling workspace crates so the binding's published manifest stays free of internal-crate dev-deps that would race release-plz's topological sort during publish."
publish      = false

[lib]
# Empty stub — the crate exists solely to host integration tests under
# `tests/`. A `src/lib.rs` is required so Cargo treats this as a package.

[dev-dependencies]
taktora-medkit-binding-connector = { workspace = true }
taktora-medkit-gateway-axum      = { workspace = true }
taktora-medkit-gateway           = { workspace = true }
taktora-medkit-provider          = { workspace = true }
taktora-medkit-model             = { workspace = true }
taktora-connector-core           = { workspace = true }

serde_json = { workspace = true, features = ["std"] }
tokio      = { workspace = true, features = ["net", "rt", "rt-multi-thread", "macros", "io-util"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
