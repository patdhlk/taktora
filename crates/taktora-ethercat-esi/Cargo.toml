[package]
name         = "taktora-ethercat-esi"
version      = "0.5.2"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Parser for EtherCAT ESI (slave information) XML into a faithful typed IR (identity, PDOs, sync managers, mailbox, distributed clocks, object dictionary)."
exclude      = ["tests/fixtures/vendor/*.xml"]

[dependencies]
taktora-fieldbus-od-core = { workspace = true }
serde     = { workspace = true, features = ["std", "derive"] }
quick-xml = { workspace = true }
thiserror = { workspace = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
