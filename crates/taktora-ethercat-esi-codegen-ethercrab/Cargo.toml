[package]
name         = "taktora-ethercat-esi-codegen-ethercrab"
version      = "0.1.9"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
homepage     = { workspace = true }
readme       = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "Code-emitting CodegenBackend for EtherCAT ESI device drivers: emits the EsiDevice impl (decode_inputs/encode_outputs) targeting the taktora-ethercat-esi-rt contract."

[dependencies]
taktora-ethercat-esi-codegen = { workspace = true }
taktora-ethercat-esi         = { workspace = true }
taktora-fieldbus-od-core     = { workspace = true }
proc-macro2 = { workspace = true }
quote       = { workspace = true }
thiserror   = { workspace = true }

[dev-dependencies]
taktora-ethercat-esi         = { workspace = true }
syn          = { workspace = true, features = ["full", "parsing"] }
prettyplease = { workspace = true }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
