name: Design proposal (RFC)
description: Propose a substantial design change, new connector, or API shift.
title: "rfc: "
labels: ["kind:rfc", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Substantial designs land as sphinx-needs directives in the
        `spec/` tree** — typically `feat::` + child `req::` directives
        under `spec/requirements/<topic>.rst`, or an `arch-decision::`
        under `spec/architecture/` for ADRs. Set `:status: draft` on
        new needs; promote to `open` once accepted. Use this issue to
        track the discussion and reference the need IDs once drafted.

        Small features belong in
        [`01-feature.yml`](?template=01-feature.yml).
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      description: Please confirm before filing.
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: I confirmed the design space isn't already covered by an existing spec or merged RFC.
          required: true
        - label: I read the relevant README or spec section.
          required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve, and why does it need a design pass before code?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: A summary of the design, plus the sphinx-needs IDs (e.g. FEAT_NNNN, REQ_NNNN, ADR_NNNN) if you've drafted them.
    validations:
      required: true
  - type: textarea
    id: crates
    attributes:
      label: Affected crates
      description: Which workspace crates does this touch? List them.
    validations:
      required: true
  - type: textarea
    id: compat
    attributes:
      label: Backwards-compat & breaking-change impact
      description: What breaks for current users? Migration path?
    validations:
      required: true
  - type: textarea
    id: drawbacks
    attributes:
      label: Drawbacks
      description: What's the cost? What new failure modes does this introduce?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you weighed against this proposal.
    validations:
      required: true
  - type: textarea
    id: unresolved
    attributes:
      label: Unresolved questions
      description: Open questions you'd like discussion to resolve before implementation.
    validations:
      required: true
  - type: dropdown
    id: drive
    attributes:
      label: Are you offering to drive implementation?
      options:
        - "Yes"
        - "Not sure"
        - "No"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
        **taktora is a pre-1.0 personal experiment.** There is no SLA,
        no support, and no backwards-compatibility guarantee. Responses
        are best-effort. See the [README](https://github.com/patdhlk/taktora#readme)
        for the full status statement.
