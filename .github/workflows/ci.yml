name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Classify the diff so doc-only (README.md) and spec-only changes can skip the
  # Rust pipeline. `code` is true unless every changed file is README.md or under
  # spec/; `spec` is true when spec/ changed. main has no required status checks,
  # so gated-out jobs (reported as "skipped") never block a merge.
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      spec: ${{ steps.classify.outputs.spec }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: ./scripts/classify-changes.sh

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - "--no-default-features"
          - ""
          - "--features tracing"
          - "--features thread_attrs"
          - "--all-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace ${{ matrix.features }}
      - name: Test
        # --test-threads=1 isolates per-test iceoryx2 resources (each Executor
        # builds a node + shared-memory segments; many in parallel can exhaust
        # /dev/shm on constrained shared runners). It is NOT for timing
        # stability — cycle-telemetry timing tests are deterministic via the
        # injected MockClock (ExecutorBuilder::clock), not wall-clock sleeps.
        run: cargo test --workspace ${{ matrix.features }} -- --test-threads=1

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  publish-deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Publish dependency order guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check internal dev-dependency publish ordering
        run: ./scripts/check-publish-deps.sh

  examples:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Examples (compile + mock-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/zenoh-pubsub-mock
            examples/zenoh-pubsub-real
            examples/ethercat-mock-loop
            examples/ethercat-real-bus
            examples/ethercat-wago-coupler
      - name: Check examples
        run: ./scripts/check-examples.sh

  complexity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Complexity gate (rust-code-analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install rust-code-analysis-cli (pinned prebuilt)
        run: |
          set -euo pipefail
          ver=v0.0.25
          url="https://github.com/mozilla/rust-code-analysis/releases/download/${ver}/rust-code-analysis-linux-cli-x86_64.tar.gz"
          curl -fsSL "$url" -o /tmp/rca.tar.gz
          # tarball contains a single file at archive root: rust-code-analysis-cli
          sudo tar -xzf /tmp/rca.tar.gz -C /usr/local/bin rust-code-analysis-cli
          sudo chmod +x /usr/local/bin/rust-code-analysis-cli
          rust-code-analysis-cli --version
      - name: Run complexity gate
        run: ./scripts/check-complexity.sh

  spec:
    needs: changes
    # Validate the spec on any spec change, and on code changes (codelinks /
    # traceability can break from code edits). Skipped only for README-only PRs.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.spec == 'true'
    name: Build specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8"
      - name: Sync spec/ deps
        working-directory: spec
        run: uv sync --frozen || uv sync
      - name: Build spec (warnings as errors)
        working-directory: spec
        run: uv run sphinx-build -W -b html . _build/html
      - name: Set up Node for mermaid validator
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: spec/scripts/package-lock.json
      - name: Install mermaid validator deps
        working-directory: spec/scripts
        run: npm ci --silent
      - name: Validate mermaid diagrams
        working-directory: spec
        run: node scripts/validate-mermaid.mjs .
