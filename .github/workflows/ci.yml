name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - "--no-default-features"
          - ""
          - "--features tracing"
          - "--features thread_attrs"
          - "--all-features"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace ${{ matrix.features }}
      - name: Test
        run: cargo test --workspace ${{ matrix.features }} -- --test-threads=1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  publish-deps:
    name: Publish dependency order guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check internal dev-dependency publish ordering
        run: ./scripts/check-publish-deps.sh

  examples:
    name: Examples (compile + mock-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples/zenoh-pubsub-mock
            examples/zenoh-pubsub-real
            examples/ethercat-mock-loop
            examples/ethercat-real-bus
            examples/ethercat-wago-coupler
      - name: Check examples
        run: ./scripts/check-examples.sh

  spec:
    name: Build specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8"
      - name: Sync spec/ deps
        working-directory: spec
        run: uv sync --frozen || uv sync
      - name: Build spec (warnings as errors)
        working-directory: spec
        run: uv run sphinx-build -W -b html . _build/html
      - name: Set up Node for mermaid validator
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: spec/scripts/package-lock.json
      - name: Install mermaid validator deps
        working-directory: spec/scripts
        run: npm ci --silent
      - name: Validate mermaid diagrams
        working-directory: spec
        run: node scripts/validate-mermaid.mjs .
