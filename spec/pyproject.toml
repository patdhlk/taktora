[project]
name = "taktora-spec"
version = "0.1.0"
description = "Specification documentation for taktora-executor."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Patrick Dahlke" }]
license = { text = "Apache-2.0 OR MIT" }

dependencies = [
    "sphinx>=7,<9",
    "sphinx-needs==8.0.0",
    "sphinx-hextra>=0.1.1",
    "myst-parser>=2",
    "sphinxcontrib-mermaid>=0.9",
    # Test-execution records (FEAT_0122): JUnit ingestion + source-marker
    # extraction, driven by the local extension in _ext/test_records.
    "sphinx-test-reports>=1.4",
    "sphinx-codelinks>=1.3",
]

[dependency-groups]
# Unit tests for the local Sphinx extensions (`uv run --group dev pytest _ext`).
dev = ["pytest>=8"]

[tool.uv]
package = false
